<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secondStyle.css">
</head>
<body>
    <div class="pattern" id="pattern"></div>

    <button class="tyk-btn" id="tykBtn">Тык!</button>

    <div class="content" id="content">
        <h1 class="content-title">VPN</h1>
        <img class="content-image" id="contentImage" src="angel.svg" alt="logo">
        <p class="content-text">Мне запретили об этом говорить</p>
        <a class="leave-btn" href="./../../index.html">Уходи</a>
    </div>

    <script>
        const pattern = document.getElementById('pattern');
        const btn     = document.getElementById('tykBtn');
        const content = document.getElementById('content');
        const image   = document.getElementById('contentImage');

        /* ---- настройки паттерна ---- */
        const TILE = 100; // размер плитки
        const GAP  = 12;  // отступ между плитками
        /* ----------------------------- */

        function buildPattern() {
            pattern.innerHTML = '';
            pattern.style.gap = GAP + 'px';
            pattern.style.padding = '4px';

            const cols = Math.max(1, Math.ceil(window.innerWidth  / (TILE + GAP)));
            const rows = Math.max(1, Math.ceil(window.innerHeight / (TILE + GAP)));
            pattern.style.gridTemplateColumns = `repeat(${cols}, ${TILE}px)`;
            pattern.style.gridTemplateRows    = `repeat(${rows}, ${TILE}px)`;

            for (let i = 0; i < cols * rows; i++) {
                const cell = document.createElement('div');
                cell.className = 'pattern-cell';
                pattern.appendChild(cell);
            }
        }
        buildPattern();
        window.addEventListener('resize', buildPattern);

        /* ---- клик по "Тык!" ---- */
        btn.addEventListener('click', () => {
            pattern.classList.add('hidden');
            btn.classList.add('hidden');

            const show = () => {
                const nw = image.naturalWidth;
                const nh = image.naturalHeight;
                
                content.classList.add('visible');
            };

            if (image.complete && image.naturalWidth) show();
            else image.onload = show;
        });
    </script>
</body>
</html>
