<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="secondStyle.css">
</head>
<body>
    <div class="pattern" id="pattern"></div>

    <button class="tyk-btn" id="tykBtn">Тык!</button>

    <div class="content" id="content">
        <h1 class="content-title">VPN</h1>
        <img class="content-image" id="contentImage" src="angel.svg" alt="logo">
        <p class="content-text">Мне запретили об этом говорить</p>
        <a class="leave-btn" href="./../../index.html">Уходи</a>
    </div>

    <script>
       /* ---- настройки паттерна ---- */
const DESKTOP_TILE = 100; // размер плитки на десктопе
const MOBILE_COLS  = 4;   // сколько картинок в ширину на мобилке
const MOBILE_W     = 600; // ширина, ниже которой считаем мобилкой
const GAP          = 12;  // отступ между плитками
/* ----------------------------- */

function buildPattern() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    let cols, tile;
    if (w <= MOBILE_W) {
        // мобилка: ровно 4 картинки в ширину, размер считаем сам
        cols = MOBILE_COLS;
        tile = (w - GAP * (cols + 1)) / cols;
    } else {
        // десктоп: как раньше
        tile = DESKTOP_TILE;
        cols = Math.max(1, Math.ceil((w - GAP) / (tile + GAP)));
    }
    const rows = Math.max(1, Math.ceil((h - GAP) / (tile + GAP)));

    pattern.style.gap = GAP + 'px';
    pattern.style.padding = GAP + 'px';
    pattern.style.gridTemplateColumns = `repeat(${cols}, ${tile}px)`;
    pattern.style.gridTemplateRows    = `repeat(${rows}, ${tile}px)`;

    pattern.innerHTML = '';
    for (let i = 0; i < cols * rows; i++) {
        const cell = document.createElement('div');
        cell.className = 'pattern-cell';
        pattern.appendChild(cell);
    }
}
buildPattern();
window.addEventListener('resize', buildPattern);
    </script>
</body>
</html>
